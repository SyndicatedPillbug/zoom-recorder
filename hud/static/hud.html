<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zoom-recorder HUD</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel-2: #1c222b;
    --border: #262d38;
    --text: #e6e9ef;
    --muted: #8b94a3;
    --accent: #5ea0ff;
    --accent-2: #7ee0a8;
    --warn: #ffcc66;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex: 0 0 auto;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .spacer { flex: 1; }
  .pill {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  .pill.live { color: var(--accent-2); border-color: #244a38; background: #10241a; }
  .pill.egress { color: var(--warn); border-color: #4a3d1f; background: #241f10; }
  .budget {
    width: 130px; height: 6px; border-radius: 3px; background: var(--panel-2);
    overflow: hidden; border: 1px solid var(--border);
  }
  .budget > span { display: block; height: 100%; width: 0; background: var(--accent); }
  main {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }
  section { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  section + section { border-left: 1px solid var(--border); }
  .right { display: flex; flex-direction: column; }
  .pane { flex: 1 1 50%; display: flex; flex-direction: column; min-height: 0; }
  .pane + .pane { border-top: 1px solid var(--border); }
  .point { margin: 0 0 8px; padding-left: 14px; position: relative; }
  .point::before { content: "•"; position: absolute; left: 0; color: var(--accent-2); }
  .point .pt { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .point .src { margin-left: 6px; }
  .point.fresh { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: #173226; } to { background: transparent; } }
  .col-head {
    flex: 0 0 auto;
    padding: 8px 16px;
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .scroll { flex: 1 1 auto; overflow-y: auto; padding: 12px 16px; scroll-behavior: smooth; }
  .line { margin: 0 0 8px; }
  .line.partial { color: var(--muted); font-style: italic; border-left: 2px solid var(--accent); padding-left: 8px; }
  .line .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; font-size: 12px; }
  .line .spk { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .line .spk.editable-speaker { cursor: text; border-radius: 4px; padding: 1px 3px; margin-left: -3px; }
  .line .spk.editable-speaker:hover { background: var(--panel-2); outline: 1px solid var(--border); }
  .speaker-edit { width: 120px; background: var(--panel-2); color: var(--text); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 4px; font: inherit; font-weight: 600; }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 0 0 12px;
  }
  .card.rolling { border-left-color: var(--muted); }
  .card.followup { margin-left: 18px; border-left-color: var(--accent-2); }
  .card .q { font-weight: 600; margin: 0 0 6px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { margin: 0 0 4px; }
  .card .meta { margin-top: 8px; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
  .src { border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .empty { color: var(--muted); font-style: italic; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); display: inline-block; }
  .dot.on { background: var(--accent-2); }
  .err { color: var(--danger); font-size: 12px; }
  .warnbar {
    padding: 8px 16px; background: #241f10; color: var(--warn);
    border-bottom: 1px solid #4a3d1f; font-size: 12px; flex: 0 0 auto;
  }
  button.mini {
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer;
  }
  button.mini:hover { border-color: var(--accent); }
  button.mini.on { color: var(--warn); border-color: #4a3d1f; background: #241f10; }
  .askbar { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--panel); flex: 0 0 auto; }
  .askbar input {
    flex: 1 1 auto; min-width: 0; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  .askbar input:focus { outline: none; border-color: var(--accent); }
  .copy { float: right; opacity: 0; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 11px; }
  .point:hover .copy, .card:hover .copy { opacity: 1; }
.point.pinned { border-left: 2px solid var(--accent); padding-left: 10px; }
.pinned-head { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; margin: 4px 0 8px; }
.details { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
.details[hidden] { display: none; }
.footerbar { position: sticky; bottom: 0; display: flex; justify-content: flex-end;
  padding: 8px 20px; background: var(--panel); border-top: 1px solid var(--border); }

/* Glass HUD mode: the native host makes the window itself transparent; these
   surfaces provide contrast without turning the entire overlay into a solid
   rectangle. Strong text shadow and a translucent backdrop keep transcript
   words readable over video, slides, and light/dark call backgrounds. */
html.overlay, body.overlay { background: transparent; }
body.overlay { padding: 8px; gap: 8px; }
body.overlay header, body.overlay .details, body.overlay .warnbar,
body.overlay .footerbar {
  background: rgba(10, 13, 19, .68);
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 14px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .34), inset 0 1px rgba(255,255,255,.07);
  -webkit-backdrop-filter: blur(18px) saturate(1.35);
  backdrop-filter: blur(18px) saturate(1.35);
}
body.overlay header { margin: 0; cursor: move; }
body.overlay .details { margin-top: -1px; }
body.overlay .warnbar { margin-top: -1px; }
body.overlay main { gap: 8px; }
body.overlay section {
  background: rgba(10, 13, 19, .42);
  border: 1px solid rgba(255, 255, 255, .15);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 10px 28px rgba(0,0,0,.30), inset 0 1px rgba(255,255,255,.06);
  -webkit-backdrop-filter: blur(14px) saturate(1.25);
  backdrop-filter: blur(14px) saturate(1.25);
}
body.overlay section + section { border-left: 1px solid rgba(255,255,255,.15); }
body.overlay .col-head { background: rgba(7, 9, 14, .58); border-bottom-color: rgba(255,255,255,.14); }
body.overlay .scroll { text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 1px rgba(0,0,0,.9); }
body.overlay .line { margin-bottom: 10px; }
body.overlay .line.partial { background: rgba(30, 55, 92, .55); border-radius: 7px; padding-top: 3px; padding-bottom: 3px; }
body.overlay .card { background: rgba(8, 10, 15, .74); border-color: rgba(255,255,255,.15); box-shadow: 0 5px 16px rgba(0,0,0,.26); }
body.overlay .askbar { background: rgba(7, 9, 14, .62); border-top-color: rgba(255,255,255,.14); }
body.overlay .footerbar { margin-top: -1px; }
body.overlay .empty { text-shadow: 0 1px 3px #000; }
body.overlay.compact { font-size: 12px; }
body.overlay.compact header { padding: 7px 10px; }
body.overlay.compact .scroll { padding: 8px 11px; }
body.overlay.compact .col-head { padding: 6px 10px; }
body.overlay.compact .card { padding: 7px 9px; margin-bottom: 8px; }
body.overlay.compact .point { margin-bottom: 5px; }
body.overlay.compact .footerbar { padding: 5px 10px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>zoom-recorder</h1>
  <span class="pill" id="status">connecting…</span>
  <div class="spacer"></div>
  <button class="mini secondary" id="detailsBtn" title="Show technical details">Details</button>
  <button class="mini" id="stopBtn">Stop recording</button>
</header>
<div class="details" id="details" hidden>
  <span class="pill egress" id="egress" title="Only transcript text leaves this Mac when answers are enabled.">answers: unknown</span>
  <span class="pill" id="lag" title="How far the live transcription is behind the audio">lag —</span>
  <span class="pill" id="partialLag" title="Interim local transcription delay">interim —</span>
  <span class="pill" id="captureSurface" title="Whether this HUD surface requests macOS capture exclusion">capture —</span>
  <span class="pill" id="answerMetrics" title="Latest answer queue, prompt, and provider timing">answer —</span>
  <span class="pill" id="level" title="Current input level vs the speech threshold (dBFS)">lvl —</span>
  <span class="pill" id="devices" title="Microphone / system audio source">mic — · sys —</span>
  <button class="mini" id="pauseBtn" title="Pause AI answers (transcript keeps running)">Pause answers</button>
  <span class="pill" id="budgetLabel">budget —</span>
  <div class="budget" title="Daily token budget used"><span id="budgetBar"></span></div>
</div>
<div class="warnbar" id="warnbar" hidden></div>
<main>
  <section>
    <div class="col-head">Live transcript</div>
    <div class="scroll" id="transcript"><p class="empty">Waiting for speech…</p></div>
  </section>
  <section class="right">
    <div class="pane">
      <div class="col-head">Suggestions</div>
      <div class="scroll" id="points"><p class="empty">Suggestions will appear here during the call.</p></div>
    </div>
    <div class="pane">
      <div class="col-head">Ask about the call</div>
      <div class="scroll" id="answers"><p class="empty">Answers will appear here.</p></div>
      <form class="askbar" id="askForm">
        <input id="askInput" type="text" placeholder="Ask a question…" autocomplete="off" />
        <button class="mini" type="submit">Ask</button>
      </form>
    </div>
  </section>
</main>
<div class="footerbar">
  <button class="mini secondary" id="openRecordings">Open recordings folder</button>
</div>
<script>
(function () {
  const surfaceParams = new URLSearchParams(location.search);
  if (surfaceParams.get('surface') === 'glass') {
    document.documentElement.classList.add('overlay');
    document.body.classList.add('overlay');
    if (surfaceParams.get('compact') === '1') document.body.classList.add('compact');
  }
  const transcriptEl = document.getElementById('transcript');
  const answersEl = document.getElementById('answers');
  const pointsEl = document.getElementById('points');
  const statusEl = document.getElementById('status');
  const egressEl = document.getElementById('egress');
  const lagEl = document.getElementById('lag');
  const partialLagEl = document.getElementById('partialLag');
  const captureSurfaceEl = document.getElementById('captureSurface');
  const answerMetricsEl = document.getElementById('answerMetrics');
  const levelEl = document.getElementById('level');
  const devicesEl = document.getElementById('devices');
  const warnbarEl = document.getElementById('warnbar');
  const dotEl = document.getElementById('dot');
  const budgetBar = document.getElementById('budgetBar');
  const budgetLabel = document.getElementById('budgetLabel');
  const pauseBtn = document.getElementById('pauseBtn');
  const askForm = document.getElementById('askForm');
  const detailsBtn = document.getElementById('detailsBtn');
  const detailsEl = document.getElementById('details');
  const stopBtn = document.getElementById('stopBtn');
  const openRecordingsBtn = document.getElementById('openRecordings');
  if (detailsBtn) detailsBtn.onclick = () => {
    detailsEl.hidden = !detailsEl.hidden;
    detailsBtn.textContent = detailsEl.hidden ? 'Details' : 'Hide details';
  };
  if (stopBtn) stopBtn.onclick = async () => {
    stopBtn.disabled = true;
    stopBtn.textContent = 'Stopping…';
    await api('/stop', 'POST', {});
    stopBtn.textContent = 'Saved';
  };
  if (openRecordingsBtn) openRecordingsBtn.onclick = () => api('/open-recordings', 'POST', {});
  const askInput = document.getElementById('askInput');
  const TOKEN = new URLSearchParams(location.search).get('token') || '';
  const PINS_KEY = 'hud.pins';
  let transcriptCount = 0, answerCount = 0, lastId = 0, paused = false;
  const partialNodes = new Map();
  const speakerLabels = Object.create(null);
  let pointItems = [];
  let pins = new Set();
  try { pins = new Set(JSON.parse(localStorage.getItem(PINS_KEY) || '[]')); } catch (e) {}

  async function api(path, method, body) {
    const sep = path.indexOf('?') >= 0 ? '&' : '?';
    const opts = { method: method || 'GET', headers: { 'X-Auth-Token': TOKEN } };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const resp = await fetch(path + sep + 'token=' + encodeURIComponent(TOKEN), opts);
    return resp.json().catch(() => ({ ok: false }));
  }
  function savePins() { try { localStorage.setItem(PINS_KEY, JSON.stringify([...pins])); } catch (e) {} }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  function clock(ts) {
    const d = ts ? new Date(ts * 1000) : new Date();
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  function atBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 80; }
  function copyText(text, btn) {
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(text).then(() => {
      const old = btn.textContent; btn.textContent = 'copied'; setTimeout(() => { btn.textContent = old; }, 900);
    });
  }

  function speakerLabel(ev) {
    const id = String(ev.speaker_id || '');
    return (id && speakerLabels[id]) || ev.speaker || '';
  }

  function speakerMarkup(ev) {
    const label = speakerLabel(ev);
    if (!label) return '';
    const id = String(ev.speaker_id || '');
    const attr = id ? ' class="spk editable-speaker" data-speaker-id="' + esc(id) + '" data-speaker-default="' + esc(ev.speaker || '') + '" title="Click to rename"' : ' class="spk"';
    return '<span' + attr + '>' + esc(label) + '</span>';
  }

  function addTranscript(ev) {
    const drafts = [...partialNodes.values()].map(node => node._partialEvent).filter(Boolean);
    if (transcriptCount === 0) { transcriptEl.innerHTML = ''; partialNodes.clear(); }
    else { drafts.forEach(node => node.remove()); partialNodes.clear(); }
    const stick = atBottom(transcriptEl);
    const p = document.createElement('p');
    p.className = 'line';
    const speaker = speakerMarkup(ev);
    p.innerHTML = '<span class="t">' + esc(clock(ev.ts)) + '</span>' + speaker + esc(ev.text || '');
    transcriptEl.appendChild(p);
    transcriptCount++;
    drafts.forEach(addPartial);
    if (stick) transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  function addPartial(ev) {
    const key = String(ev.source_key || ev.speaker_id || ev.speaker || 'mixed');
    const text = String(ev.text || '').trim();
    let p = partialNodes.get(key);
    if (!text) {
      if (p) { p.remove(); partialNodes.delete(key); }
      return;
    }
    if (!p) {
      p = document.createElement('p');
      p.className = 'line partial';
      partialNodes.set(key, p);
      transcriptEl.appendChild(p);
    }
    p._partialEvent = ev;
    const speaker = speakerMarkup(ev);
    p.innerHTML = '<span class="t">live</span>' + speaker + esc(text);
    if (atBottom(transcriptEl)) transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  function pointNode(p, fresh) {
    const isPinned = pins.has(p.text);
    const el = document.createElement('p');
    el.className = 'point' + (fresh ? ' fresh' : '') + (isPinned ? ' pinned' : '');
    let html = esc(p.text) + '<span class="pt">' + esc(clock(p.ts)) + '</span>';
    (p.sources || []).forEach(s => { html += '<span class="src">' + esc(s) + '</span>'; });
    html += '<button class="copy pin" title="Pin or unpin">' + (isPinned ? 'unpin' : 'pin') + '</button>';
    html += '<button class="copy" title="Copy">copy</button>';
    el.innerHTML = html;
    const [pinBtn, copyBtn] = el.querySelectorAll('button');
    copyBtn.onclick = () => copyText(p.text, copyBtn);
    pinBtn.onclick = () => {
      if (pins.has(p.text)) pins.delete(p.text); else pins.add(p.text);
      savePins(); renderPoints();
    };
    return el;
  }

  function renderPoints() {
    const stick = atBottom(pointsEl);
    pointsEl.innerHTML = '';
    if (!pointItems.length) {
      pointsEl.innerHTML = '<p class="empty">Suggestions will appear here during the call.</p>';
      return;
    }
    const pinned = pointItems.filter(p => pins.has(p.text));
    const rest = pointItems.filter(p => !pins.has(p.text));
    if (pinned.length) {
      const h = document.createElement('div');
      h.className = 'pinned-head';
      h.textContent = 'Pinned';
      pointsEl.appendChild(h);
      pinned.forEach(p => pointsEl.appendChild(pointNode(p, false)));
    }
    rest.forEach(p => pointsEl.appendChild(pointNode(p, p.fresh)));
    if (stick) pointsEl.scrollTop = pointsEl.scrollHeight;
  }

  function addPoint(ev) {
    pointItems.push({ text: ev.text, ts: ev.ts, sources: ev.sources || [], fresh: true });
    renderPoints();
  }

  function addAnswer(ev) {
    if (answerCount === 0) answersEl.innerHTML = '';
    const stick = atBottom(answersEl);
    const card = document.createElement('div');
    card.className = 'card' + (ev.parent_id ? ' followup' : '');
    const title = ev.question ? esc(ev.question) : 'Answer';
    let html = '<div class="q">' + title + '</div><ul>';
    (ev.bullets || []).forEach(b => { html += '<li>' + esc(b) + '</li>'; });
    html += '</ul><div class="meta"><span>' + esc(clock(ev.ts)) + '</span>';
    if (ev.model) html += '<span class="src">' + esc(ev.model) + '</span>';
    (ev.sources || []).forEach(s => { html += '<span class="src">' + esc(s) + '</span>'; });
    if (ev.error) html += '<span class="err">' + esc(ev.error) + '</span>';
    html += '<button class="copy" title="Copy answer">copy</button>';
    html += '</div>';
    card.innerHTML = html;
    const copyBtn = card.querySelector('.copy');
    copyBtn.onclick = () => copyText((ev.question || '') + '\n' + (ev.bullets || []).join('\n'), copyBtn);
    answersEl.appendChild(card);
    answerCount++;
    if (ev.answer_queue_wait !== undefined || ev.prompt_chars !== undefined) {
      const wait = Number(ev.answer_queue_wait || 0).toFixed(1);
      const chars = Number(ev.prompt_chars || 0);
      let label = 'answer q ' + wait + 's · prompt ' + chars;
      if (ev.retrieval_seconds !== undefined) {
        label += ' · KB ' + Number(ev.retrieval_seconds).toFixed(2) + 's/' +
          Number(ev.retrieved_count || 0) + ' snippets';
      }
      answerMetricsEl.textContent = label;
    }
    if (stick) answersEl.scrollTop = answersEl.scrollHeight;
  }

  function setPaused(p) {
    paused = !!p;
    pauseBtn.classList.toggle('on', paused);
    pauseBtn.textContent = paused ? 'Resume answers' : 'Pause answers';
  }

  function applySpeakerMapping(ev) {
    const id = String(ev.speaker_id || '');
    if (!id) return;
    const label = String(ev.label || '').trim();
    if (label) speakerLabels[id] = label;
    else delete speakerLabels[id];
    transcriptEl.querySelectorAll('.editable-speaker[data-speaker-id="' + CSS.escape(id) + '"]').forEach(node => {
      node.textContent = label || node.getAttribute('data-speaker-default') || '';
    });
    // Re-render only the provisional lines, which are few and never touch the
    // authoritative transcript scroll history.
    partialNodes.forEach(node => {
      if (node && node._partialEvent && String(node._partialEvent.speaker_id || '') === id) {
        addPartial(node._partialEvent);
      }
    });
  }

  async function editSpeaker(node) {
    const id = node.getAttribute('data-speaker-id');
    if (!id || node.querySelector('input')) return;
    const old = node.textContent || '';
    const input = document.createElement('input');
    input.className = 'speaker-edit';
    input.maxLength = 80;
    input.value = old;
    let committed = false;
    const finish = async (save) => {
      if (committed) return;
      committed = true;
      if (!save) { node.textContent = old; return; }
      const label = input.value.trim();
      const result = await api('/speaker-label', 'POST', { speaker_id: id, label: label });
      if (!result || !result.ok) node.textContent = old;
    };
    node.textContent = '';
    node.appendChild(input);
    input.focus(); input.select();
    input.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    };
    input.onblur = () => finish(true);
  }

  transcriptEl.addEventListener('click', e => {
    const node = e.target.closest && e.target.closest('.editable-speaker');
    if (node) editSpeaker(node);
  });

  function applyStatus(ev) {
    const meta = ev.meta || {};
    const explicit = ev.status || meta.status;
    if (explicit) {
      statusEl.textContent = explicit;
      statusEl.className = 'pill ' + (explicit === 'recording' || explicit === 'live' ? 'live' : '');
      dotEl.className = 'dot ' + (explicit === 'error' ? '' : 'on');
    }
    if (meta.answers_backend) {
      egressEl.textContent = meta.answers_enabled === false
        ? 'answers: off'
        : 'transcript → ' + meta.answers_backend;
    }
    if (meta.stt_lag_seconds !== undefined) {
      lagEl.textContent = 'lag ' + Number(meta.stt_lag_seconds).toFixed(1) + 's';
    }
    if (meta.stt_partial_latency !== undefined) {
      partialLagEl.textContent = 'interim ' + Number(meta.stt_partial_latency).toFixed(1) + 's';
    }
    if (meta.hud_surface) {
      const native = meta.hud_surface === 'native';
      const mode = meta.hud_mode === 'glass' ? 'glass HUD' : 'native window';
      captureSurfaceEl.textContent = native ? mode + ' · best effort' : 'browser · visible';
      captureSurfaceEl.className = 'pill ' + (native ? 'egress' : '');
      captureSurfaceEl.title = native
        ? (meta.hud_capture_protection || 'macOS sharing exclusion requested; verify with your call app')
        : 'Browser HUD has no native capture exclusion';
    }
    if (meta.stt_vad_level_db !== undefined) {
      const lvl = Number(meta.stt_vad_level_db);
      const thr = meta.stt_vad_threshold_db;
      levelEl.textContent = 'lvl ' + lvl.toFixed(0) + (thr !== undefined ? '/' + Number(thr).toFixed(0) : '') + ' dB';
      levelEl.style.color = (thr !== undefined && lvl > Number(thr)) ? 'var(--accent-2)' : 'var(--muted)';
    }
    if (meta.mic_device !== undefined || meta.system_device !== undefined) {
      devicesEl.textContent = 'mic: ' + (meta.mic_device || '?') + ' · sys: ' + (meta.system_device || 'none');
      devicesEl.style.color = meta.system_audio_warning ? 'var(--warn)' : 'var(--muted)';
    }
    if (meta.system_audio_warning !== undefined) {
      if (meta.system_audio_warning) {
        warnbarEl.hidden = false;
        warnbarEl.textContent = meta.system_audio_warning;
      } else {
        warnbarEl.hidden = true;
        warnbarEl.textContent = '';
      }
    }
    if (meta.answers_paused !== undefined) setPaused(meta.answers_paused);
    const b = ev.budget || {};
    if (b.tpd_limit) {
      const used = Math.min(100, Math.round(100 * (b.day_tokens || 0) / b.tpd_limit));
      budgetBar.style.width = used + '%';
      budgetBar.style.background = used > 85 ? 'var(--danger)' : (used > 60 ? 'var(--warn)' : 'var(--accent)');
      budgetLabel.textContent = 'budget ' + used + '%';
    }
  }

  function handle(ev) {
    // Events carry monotonically increasing ids; ignore replay on reconnect.
    if (ev.id) {
      if (ev.id <= lastId) return;
      lastId = ev.id;
    }
    if (ev.type === 'speaker_mapping') applySpeakerMapping(ev);
    else if (ev.type === 'transcript') addTranscript(ev);
    else if (ev.type === 'transcript_partial') addPartial(ev);
    else if (ev.type === 'talking_point') addPoint(ev);
    else if (ev.type === 'answer') addAnswer(ev);
    else if (ev.type === 'answer_update') {
      const f = ev.fields || {};
      if (f.provider_ttft !== undefined || f.provider_seconds !== undefined) {
        const ttft = f.provider_ttft == null ? '—' : Number(f.provider_ttft).toFixed(1) + 's';
        const total = f.provider_seconds == null ? '—' : Number(f.provider_seconds).toFixed(1) + 's';
        answerMetricsEl.textContent += ' · TTFT ' + ttft + ' · total ' + total;
      }
    }
    else if (ev.type === 'status' || ev.type === 'meta') applyStatus(ev);
    else if (ev.type === 'budget') applyStatus({ budget: ev.budget, meta: ev.meta, status: ev.status });
  }

  // Rebuild both answer panes from the server snapshot (e.g. after a reload).
  function hydrate(snap) {
    Object.keys(snap.speaker_mappings || {}).forEach(id => {
      const mapping = snap.speaker_mappings[id] || {};
      if (mapping.label) speakerLabels[id] = mapping.label;
    });
    (snap.transcript || []).forEach(addTranscript);
    (snap.partials || []).forEach(addPartial);
    (snap.answers || []).forEach(addAnswer);
    pointItems = (snap.talking_points || []).map(p => (
      { text: p.text, ts: p.ts, sources: p.sources || [], fresh: false }));
    renderPoints();
    applyStatus(snap);
    if (snap.latest_id) lastId = snap.latest_id;
  }

  pauseBtn.onclick = async () => { await api('/pause', 'POST', { paused: !paused }); };
  askForm.onsubmit = async (e) => {
    e.preventDefault();
    const text = askInput.value.trim();
    if (!text) return;
    askInput.value = '';
    await api('/ask', 'POST', { text: text });
  };

  function connect() {
    api('/state').then(snap => {
      if (snap && snap.latest_id !== undefined) hydrate(snap);
      const es = new EventSource('/events?since=' + lastId + '&token=' + encodeURIComponent(TOKEN));
      es.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (err) {} };
      es.onopen = () => { statusEl.textContent = 'live'; dotEl.className = 'dot on'; };
      es.onerror = () => { statusEl.textContent = 'reconnecting…'; dotEl.className = 'dot'; };
    });
  }
  connect();
})();
</script>
</body>
</html>
